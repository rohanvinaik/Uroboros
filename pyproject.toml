[build-system]
requires = ["setuptools>=77"]          # >=77 accepts the PEP 639 SPDX `license = "MIT"` string
build-backend = "setuptools.build_meta"

[project]
name = "uroboros-refactor"
version = "0.1.0"
description = "Run Python contracts with small local models and verify the result with Detective."
readme = "README.md"
license = "MIT"
authors = [{ name = "Rohan Vinaik" }]
requires-python = ">=3.12"
dependencies = [
    "detective-spec>=1.2.2,<2",
]

[project.scripts]
uroboros = "uroboros.harness.contract:main"
uroboros-admission = "uroboros.harness.admission:main"
uroboros-cassette = "uroboros.harness.cli:main"
uroboros-crawl = "uroboros.cycle:main"
uroboros-launch = "uroboros.launch:main"   # constrained-output chat launcher

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["uroboros*"]

[tool.setuptools.package-data]
"uroboros.harness" = ["cassettes/*/*.toml", "cassettes/*/*.md", "cassettes/*/vocab/*.txt"]

[tool.pytest.ini_options]
markers = ["detective: test generated by Detective"]
testpaths = ["tests"]
